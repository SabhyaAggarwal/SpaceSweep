name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: Build SpaceSweep.app (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**/*.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run engine tests
        run: swift test

      - name: Build app bundle
        run: ./build.sh

      - name: Verify bundle
        run: |
          ls -R build/SpaceSweep.app
          codesign --verify --verbose build/SpaceSweep.app
          plutil -lint build/SpaceSweep.app/Contents/Info.plist

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent build/SpaceSweep.app SpaceSweep.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceSweep.app
          path: SpaceSweep.app.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SpaceSweep.app.zip
          generate_release_notes: true

  linux:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test
